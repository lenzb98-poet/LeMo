<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LeMo</title>
  <link rel="stylesheet" href="src/style.css?v=8">
</head>
<body>
  <!-- Homescreen -->
  <main id="home" class="screen">
    <header>
      <canvas id="logo" width="64" height="64"></canvas>
      <h1>LeMo</h1>
      <p class="sub">Spiel dein Leben noch einmal durch</p>
    </header>

    <section>
      <h2>Staffeln des Lebens</h2>
      <div class="grid" id="seasons"></div>
    </section>

    <section>
      <h2>Demo</h2>
      <div class="grid" id="demos"></div>
    </section>

    <p id="hint" class="hint"></p>
  </main>

  <!-- Spiel -->
  <div id="stage" class="screen hidden">
    <button id="back" type="button">&larr; Menü</button>
    <canvas id="game"></canvas>
    <div id="caption"></div>
    <div id="counter"></div>
    <div id="memory" class="hidden">
      <div class="card">
        <canvas id="memoryPic" width="96" height="72"></canvas>
        <div class="body">
          <h3 id="memoryTitle"></h3>
          <p id="memoryText"></p>
          <p class="hint" id="memoryHint"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="src/sprite.js?v=8"></script>
  <script src="src/bed.js?v=8"></script>
  <script src="src/world.js?v=8"></script>
  <script src="src/memories.js?v=8"></script>
  <script src="src/memory.js?v=8"></script>
  <script src="src/game.js?v=8"></script>
  <script src="src/home.js?v=8"></script>
</body>
</html>
