<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lenz Memory's</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <!-- Homescreen -->
  <main id="home" class="screen">
    <header>
      <canvas id="logo" width="64" height="64"></canvas>
      <h1>Lenz Memory's</h1>
      <p class="sub">Spiel dein Leben noch einmal durch</p>
    </header>

    <section>
      <h2>Staffeln des Lebens</h2>
      <div class="grid" id="seasons"></div>
    </section>

    <section>
      <h2>Demo</h2>
      <div class="grid" id="demos"></div>
    </section>

    <p id="hint" class="hint"></p>
  </main>

  <!-- Spiel -->
  <div id="stage" class="screen hidden">
    <button id="back" type="button">&larr; Menü</button>
    <canvas id="game"></canvas>
  </div>

  <script src="src/sprite.js"></script>
  <script src="src/game.js"></script>
  <script src="src/home.js"></script>
</body>
</html>
