<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LeMo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap">
  <link rel="stylesheet" href="src/style.css?v=14">
</head>
<body>
  <!-- Hauptmenü -->
  <main id="home" class="screen">
    <div id="menuStage">
      <canvas id="menuArt"></canvas>
      <header class="brand">
        <h1>LeMo</h1>
        <p class="sub">Lenz Memory's</p>
      </header>
      <p id="menuCaption"></p>
      <div id="slots"></div>
      <section id="chapter" class="hidden" aria-live="polite">
        <div class="kicker" id="chKicker"></div>
        <h2 id="chTitle"></h2>
        <p id="chDesc"></p>
        <p id="chStatus"></p>
        <div class="actions">
          <button type="button" id="chPlay">Spielen</button>
          <button type="button" id="chBack">Zurück in den Turm</button>
        </div>
        <p class="tip">Oder tippe neben die Karte, um sie zurückzustecken.</p>
      </section>
    </div>
  </main>

  <!-- Spiel -->
  <div id="stage" class="screen hidden">
    <button id="back" type="button">&larr; Menü</button>
    <canvas id="game"></canvas>
    <div id="caption"></div>
    <div id="counter"></div>
    <div id="memory" class="hidden">
      <div class="card">
        <canvas id="memoryPic" width="96" height="72"></canvas>
        <div class="body">
          <h3 id="memoryTitle"></h3>
          <p id="memoryText"></p>
          <p class="hint" id="memoryHint"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="src/sprite.js?v=14"></script>
  <script src="src/bed.js?v=14"></script>
  <script src="src/world.js?v=14"></script>
  <script src="src/memories.js?v=14"></script>
  <script src="src/memory.js?v=14"></script>
  <script src="src/game.js?v=14"></script>
  <script src="src/menuart.js?v=14"></script>
  <script src="src/home.js?v=14"></script>
</body>
</html>
