<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LeMo</title>
  <link rel="stylesheet" href="src/style.css?v=9">
</head>
<body>
  <!-- Hauptmenü -->
  <main id="home" class="screen">
    <div id="menuStage">
      <canvas id="menuArt"></canvas>
      <header class="brand">
        <h1>LeMo</h1>
        <p class="sub">Spiel dein Leben noch einmal durch</p>
        <p id="hint" class="hint"></p>
      </header>
      <div class="tower" id="tower"></div>
    </div>
  </main>

  <!-- Spiel -->
  <div id="stage" class="screen hidden">
    <button id="back" type="button">&larr; Menü</button>
    <canvas id="game"></canvas>
    <div id="caption"></div>
    <div id="counter"></div>
    <div id="memory" class="hidden">
      <div class="card">
        <canvas id="memoryPic" width="96" height="72"></canvas>
        <div class="body">
          <h3 id="memoryTitle"></h3>
          <p id="memoryText"></p>
          <p class="hint" id="memoryHint"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="src/sprite.js?v=9"></script>
  <script src="src/bed.js?v=9"></script>
  <script src="src/world.js?v=9"></script>
  <script src="src/memories.js?v=9"></script>
  <script src="src/memory.js?v=9"></script>
  <script src="src/game.js?v=9"></script>
  <script src="src/menuart.js?v=9"></script>
  <script src="src/home.js?v=9"></script>
</body>
</html>
